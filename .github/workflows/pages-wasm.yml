name: Deploy WASM demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let in-flight deploys finish; canceling mid-deploy can leave bad state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Configure WASM build
        run: |
          emcmake cmake -S . -B build-wasm \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTIRAMISU_BUILD_WASM=ON \
            -DTIRAMISU_BUILD_TESTS=OFF \
            -DTIRAMISU_BUILD_EXAMPLES=ON \
            -DTIRAMISU_BUILD_BENCH=OFF \
            -DTIRAMISU_BUILD_PYTHON=OFF \
            -DTIRAMISU_ENABLE_CUDA=OFF \
            -DTIRAMISU_ENABLE_SANITIZERS=OFF

      - name: Build WASM inference target
        run: cmake --build build-wasm --target tiramisu_infer

      - name: Assemble static site
        run: |
          mkdir -p site/assets
          cp -r web/static/* site/
          cp build-wasm/examples/tiramisu_infer.js site/
          cp build-wasm/examples/tiramisu_infer.wasm site/
          cp checkpoints/shakespeare_2m.ckpt site/assets/
          touch site/.nojekyll
          echo tiramisu.dnex.dev > site/CNAME
          test -s site/assets/shakespeare_2m.ckpt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
