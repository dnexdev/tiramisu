[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13", "numpy>=1.24"]
build-backend = "scikit_build_core.build"

[project]
name = "tiramisu-ml"
version = "0.2.1"
description = "ML framework with tensors, autograd, NN modules, optimizers, transformers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.0"]

[tool.scikit-build]
wheel.packages = ["python/tiramisu"]
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
TIRAMISU_BUILD_PYTHON = "ON"
TIRAMISU_BUILD_TESTS = "OFF"
TIRAMISU_BUILD_EXAMPLES = "OFF"
TIRAMISU_ENABLE_SANITIZERS = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = ["*-musllinux_*", "pp*", "*-win32", "*-manylinux_i686"]
build-frontend = "build"
test-requires = ["numpy", "pytest"]
test-command = 'python -c "import tiramisu as tr, numpy as np; x = tr.from_numpy(np.zeros((2, 3), dtype=np.float32)); assert x.shape() == [2, 3]; print(tr.nn.Linear(10, 5))"'

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
# Build both arches on the macos-14 (arm64) runner; x86_64 is cross-compiled.
# cibuildwheel auto-skips the test-command for cross-built wheels.
archs = ["arm64", "x86_64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "13.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
